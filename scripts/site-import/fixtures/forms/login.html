<form name="loginform" id="loginform" action="https://example.com/wp-login.php" method="post">
  <p><label for="user_login">Username or Email Address</label><input type="text" name="log" id="user_login" autocomplete="username" value=""></p>
  <p><label for="user_pass">Password</label><input type="password" name="pwd" id="user_pass" autocomplete="current-password" value=""></p>
  <p><label><input name="rememberme" type="checkbox" id="rememberme" value="forever"> Remember Me</label></p>
  <p><input type="submit" name="wp-submit" id="wp-submit" value="Log In"><input type="hidden" name="redirect_to" value="https://example.com/wp-admin/"></p>
</form>
